<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>📈 全球行情看板 · 实时搜索</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .dashboard {
            max-width: 820px;
            width: 100%;
            background: white;
            border-radius: 36px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0, 0, 0, 0.04);
            padding: 28px 22px 32px;
        }
        h1 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 1.7rem;
            letter-spacing: -0.3px;
            color: #0b1b33;
            margin-bottom: 8px;
        }
        h1 small {
            font-size: 0.8rem;
            font-weight: 400;
            color: #5b6f88;
            margin-left: auto;
            background: #eef2f7;
            padding: 4px 14px;
            border-radius: 40px;
        }
        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            color: #5b6f88;
            margin-bottom: 16px;
            padding: 6px 14px;
            background: #f0f4fa;
            border-radius: 30px;
            flex-wrap: wrap;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            background: #0d7c4b;
        }
        .subhead {
            color: #3a4c66;
            font-size: 0.95rem;
            margin-bottom: 20px;
            border-left: 4px solid #2469f0;
            padding-left: 14px;
            background: #f0f5ff;
            border-radius: 0 12px 12px 0;
            line-height: 1.4;
        }
        .search-box {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-box input {
            flex: 2 1 200px;
            padding: 14px 18px;
            border: 1px solid #d9e0e8;
            border-radius: 60px;
            font-size: 1rem;
            background: #fafcff;
            outline: none;
            transition: 0.2s;
            color: #0a1a2f;
        }
        .search-box input:focus {
            border-color: #2469f0;
            background: white;
            box-shadow: 0 0 0 3px rgba(36, 105, 240, 0.15);
        }
        .search-box input::placeholder {
            color: #8a9bb0;
        }
        .search-box button {
            flex: 0 0 auto;
            padding: 14px 28px;
            background: #2469f0;
            color: white;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 6px 14px rgba(36, 105, 240, 0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .search-box button:hover {
            background: #1a56d0;
            transform: scale(0.97);
        }
        .search-box button:active {
            transform: scale(0.94);
        }
        .search-box button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .card-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 6px;
            min-height: 100px;
        }

        .stock-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 16px 18px 14px;
            border: 1px solid #edf2f9;
            transition: 0.15s;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .stock-card:hover {
            border-color: #cddae9;
            background: #fbfdff;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .card-title .symbol {
            font-weight: 650;
            font-size: 1.1rem;
            color: #0b1b33;
        }
        .card-title .name {
            font-size: 0.85rem;
            color: #49607c;
        }
        .card-title .exchange {
            font-size: 0.65rem;
            background: #e8edf6;
            padding: 2px 10px;
            border-radius: 30px;
            color: #2c405c;
        }
        .card-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .card-actions .remove-btn {
            background: none;
            border: none;
            color: #b0c0d0;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 6px;
            transition: 0.15s;
        }
        .card-actions .remove-btn:hover {
            color: #bc2c3e;
        }
        .card-actions .refresh-btn {
            background: none;
            border: none;
            color: #8a9bb0;
            font-size: 1rem;
            cursor: pointer;
            padding: 0 6px;
            transition: 0.15s;
        }
        .card-actions .refresh-btn:hover {
            color: #2469f0;
            transform: rotate(180deg);
        }

        .iframe-wrapper {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #f8faff;
            border: 1px solid #eef3f9;
            position: relative;
            min-height: 320px;
        }
        .iframe-wrapper iframe {
            width: 100%;
            height: 320px;
            border: none;
            display: block;
        }
        .iframe-wrapper .loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(248, 250, 255, 0.92);
            color: #6f86a3;
            font-size: 0.9rem;
            gap: 12px;
            transition: opacity 0.5s;
            pointer-events: none;
        }
        .iframe-wrapper .loading-overlay.hidden {
            opacity: 0;
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #e8edf6;
            border-top-color: #2469f0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 32px 10px;
            color: #6f86a3;
            background: #f8faff;
            border-radius: 40px;
            border: 1px dashed #d2ddea;
        }
        .empty-state span {
            font-size: 2.6rem;
            display: block;
            margin-bottom: 8px;
        }
        .empty-state p {
            font-size: 0.95rem;
        }

        .footer-note {
            margin-top: 24px;
            font-size: 0.75rem;
            color: #7b91ad;
            text-align: center;
            border-top: 1px solid #eef3f9;
            padding-top: 18px;
        }

        .hint-text {
            font-size: 0.75rem;
            color: #8a9bb0;
            margin-top: 4px;
        }

        @media (max-width: 500px) {
            .dashboard { padding: 20px 16px; }
            .iframe-wrapper iframe { height: 250px; }
            .iframe-wrapper { min-height: 250px; }
            .card-title .name { max-width: 100px; overflow: hidden; text-overflow: ellipsis; }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <h1>
        📊 全球看板
        <small>🌐 实时行情</small>
    </h1>
    <div class="status-bar">
        <span class="status-dot"></span>
        <span>✅ 实时数据 · 来自新浪财经</span>
    </div>
    <div class="subhead">
        🔍 输入基金/股票代码或名称 · 点击添加查看实时K线
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="例: 00700, AAPL, 贵州茅台, 510300" value="">
        <button id="searchBtn">➕ 添加</button>
    </div>

    <div id="cardContainer" class="card-grid">
        <div class="empty-state" id="emptyPlaceholder">
            <span>📭</span>
            <p>输入代码或名称，点击添加<br>将显示该标的的实时行情</p>
            <p style="font-size:0.8rem; margin-top:8px; color:#8a9bb0;">
                💡 数据来自新浪财经 · 包含分时/日K/5日/月K
            </p>
        </div>
    </div>
    <div class="footer-note">
        ⚡ 每个卡片内嵌实时行情 · 点击「⟳」刷新 · 点击「✕」移除
    </div>
</div>

<script>
    (function() {
        // ---------- 核心状态 ----------
        let watchList = [];
        const container = document.getElementById('cardContainer');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');

        // ---------- 内置标的库 (用于显示名称和交易所) ----------
        const STOCK_DB = {
            // 港股
            '00700': { name: '腾讯控股', exchange: 'HKEX' },
            '09988': { name: '阿里巴巴-SW', exchange: 'HKEX' },
            '03690': { name: '美团-W', exchange: 'HKEX' },
            '09999': { name: '网易-S', exchange: 'HKEX' },
            '00941': { name: '中国移动', exchange: 'HKEX' },
            '02318': { name: '中国平安', exchange: 'HKEX' },
            '00388': { name: '香港交易所', exchange: 'HKEX' },
            '02020': { name: '安踏体育', exchange: 'HKEX' },
            '09618': { name: '京东集团-SW', exchange: 'HKEX' },
            '09888': { name: '百度集团-SW', exchange: 'HKEX' },
            // 美股
            'AAPL': { name: '苹果', exchange: 'NASDAQ' },
            'TSLA': { name: '特斯拉', exchange: 'NASDAQ' },
            'AMZN': { name: '亚马逊', exchange: 'NASDAQ' },
            'MSFT': { name: '微软', exchange: 'NASDAQ' },
            'GOOGL': { name: '谷歌', exchange: 'NASDAQ' },
            'BABA': { name: '阿里巴巴', exchange: 'NYSE' },
            'NVDA': { name: '英伟达', exchange: 'NASDAQ' },
            'META': { name: 'Meta', exchange: 'NASDAQ' },
            'NFLX': { name: '奈飞', exchange: 'NASDAQ' },
            'INTC': { name: '英特尔', exchange: 'NASDAQ' },
            // A股
            '600519': { name: '贵州茅台', exchange: 'SSE' },
            '000858': { name: '五粮液', exchange: 'SZSE' },
            '601318': { name: '中国平安', exchange: 'SSE' },
            '000001': { name: '平安银行', exchange: 'SZSE' },
            '600036': { name: '招商银行', exchange: 'SSE' },
            '002594': { name: '比亚迪', exchange: 'SZSE' },
            '300750': { name: '宁德时代', exchange: 'SZSE' },
            '600900': { name: '长江电力', exchange: 'SSE' },
            '601288': { name: '农业银行', exchange: 'SSE' },
            '600276': { name: '恒瑞医药', exchange: 'SSE' },
            // 基金
            '510300': { name: '沪深300ETF', exchange: 'SSE' },
            '159919': { name: '嘉实沪深300ETF', exchange: 'SZSE' },
            '513050': { name: '中概互联网ETF', exchange: 'SSE' },
        };

        // ---------- 构建新浪财经实时行情 iframe URL (修正版) ----------
        function buildIframeUrl(symbol) {
            const upper = symbol.toUpperCase().trim();
            // 判断市场并构建正确的新浪代码
            let sinaCode = '';
            if (/^[A-Z]+$/.test(upper) && !/^(SH|SZ|HK)/.test(upper)) {
                // 美股
                sinaCode = `us${upper}`;
            } else if (/^0\d{4}/.test(upper) || upper.includes('.HK')) {
                // 港股
                const num = upper.replace(/\D/g, '');
                if (num.length === 5) sinaCode = `hk${num}`;
                else if (num.length === 4) sinaCode = `hk0${num}`;
                else sinaCode = `hk${num}`;
            } else if (/^6\d{5}/.test(upper)) {
                sinaCode = `sh${upper}`;
            } else if (/^[03]\d{5}/.test(upper)) {
                sinaCode = `sz${upper}`;
            } else if (/^5\d{5}/.test(upper)) {
                sinaCode = `sh${upper}`;
            } else if (/^1[56]\d{4}/.test(upper)) {
                sinaCode = `sz${upper}`;
            } else if (upper.length === 5) {
                if (upper.startsWith('6')) sinaCode = `sh${upper}`;
                else if (upper.startsWith('0') || upper.startsWith('3')) sinaCode = `sz${upper}`;
            }

            if (!sinaCode) return null;

            // 使用新浪财经的移动端适配行情页 (更简洁，加载更快)
            // 这个页面包含了分时图、报价、涨跌幅等完整信息
            return `https://finance.sina.com.cn/realstock/company/${sinaCode}/nc.shtml`;
        }

        // ---------- 获取标的名称 ----------
        function getStockInfo(symbol) {
            const upper = symbol.toUpperCase().trim();
            if (STOCK_DB[upper]) {
                return { name: STOCK_DB[upper].name, exchange: STOCK_DB[upper].exchange };
            }
            // 模糊匹配
            for (let key in STOCK_DB) {
                if (key.includes(upper) || upper.includes(key)) {
                    return { name: STOCK_DB[key].name, exchange: STOCK_DB[key].exchange };
                }
            }
            // 尝试从代码推断
            let exchange = '--';
            if (/^[A-Z]+$/.test(upper)) exchange = 'NASDAQ/NYSE';
            else if (/^0\d{4}/.test(upper)) exchange = 'HKEX';
            else if (/^6\d{5}/.test(upper)) exchange = 'SSE';
            else if (/^[03]\d{5}/.test(upper)) exchange = 'SZSE';
            return { name: upper, exchange: exchange };
        }

        // ---------- 添加卡片 ----------
        function addItemByQuery(query) {
            if (!query || query.trim() === '') {
                alert('请输入代码或名称');
                return false;
            }
            const q = query.trim().toUpperCase();

            // 检查是否已存在
            const exists = watchList.some(item => item.symbol === q);
            if (exists) {
                alert(`"${q}" 已在看板中`);
                return false;
            }

            // 构建iframe URL
            const iframeSrc = buildIframeUrl(q);
            if (!iframeSrc) {
                alert(`无法识别代码: ${q}\n请使用标准格式 (如 00700, AAPL, 600519)`);
                return false;
            }

            const info = getStockInfo(q);
            watchList.push({
                symbol: q,
                name: info.name,
                exchange: info.exchange,
                iframeSrc: iframeSrc,
                id: Date.now() + Math.random()
            });

            renderCards();
            searchInput.value = '';
            return true;
        }

        // ---------- 渲染卡片 ----------
        function renderCards() {
            container.innerHTML = '';

            if (watchList.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-state';
                emptyDiv.innerHTML = `
                    <span>📭</span>
                    <p>输入代码或名称，点击添加<br>将显示该标的的实时行情</p>
                    <p style="font-size:0.8rem; margin-top:8px; color:#8a9bb0;">
                        💡 数据来自新浪财经 · 包含分时/日K/5日/月K
                    </p>
                `;
                container.appendChild(emptyDiv);
                return;
            }

            watchList.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'stock-card';

                // ---- 头部 ----
                const header = document.createElement('div');
                header.className = 'card-header';

                const title = document.createElement('div');
                title.className = 'card-title';
                title.innerHTML = `
                    <span class="symbol">${item.symbol}</span>
                    <span class="name">${item.name}</span>
                    <span class="exchange">${item.exchange}</span>
                `;

                const actions = document.createElement('div');
                actions.className = 'card-actions';
                
                // 刷新按钮
                const refreshBtn = document.createElement('button');
                refreshBtn.className = 'refresh-btn';
                refreshBtn.textContent = '⟳';
                refreshBtn.title = '刷新行情';
                refreshBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const iframe = card.querySelector('iframe');
                    if (iframe) {
                        const src = iframe.src;
                        iframe.src = '';
                        setTimeout(() => { iframe.src = src; }, 100);
                    }
                });

                // 移除按钮
                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.textContent = '✕';
                removeBtn.title = '移除';
                removeBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    watchList = watchList.filter((w, idx) => idx !== index);
                    renderCards();
                });

                actions.appendChild(refreshBtn);
                actions.appendChild(removeBtn);

                header.appendChild(title);
                header.appendChild(actions);

                // ---- iframe 容器 ----
                const wrapper = document.createElement('div');
                wrapper.className = 'iframe-wrapper';

                const loading = document.createElement('div');
                loading.className = 'loading-overlay';
                loading.innerHTML = `
                    <div class="spinner"></div>
                    <span>加载实时行情中...</span>
                    <span style="font-size:0.75rem; color:#8a9bb0;">${item.symbol} ${item.name}</span>
                `;

                const iframe = document.createElement('iframe');
                iframe.src = item.iframeSrc;
                iframe.allow = 'autoplay';
                iframe.loading = 'lazy';
                iframe.sandbox = 'allow-scripts allow-same-origin allow-popups allow-forms';

                // 加载完成后隐藏loading
                iframe.addEventListener('load', function() {
                    loading.classList.add('hidden');
                });

                // 5秒后自动隐藏loading（防止卡住）
                setTimeout(() => {
                    loading.classList.add('hidden');
                }, 8000);

                wrapper.appendChild(iframe);
                wrapper.appendChild(loading);

                card.appendChild(header);
                card.appendChild(wrapper);

                container.appendChild(card);
            });
        }

        // ---------- 事件绑定 ----------
        searchBtn.addEventListener('click', function(e) {
            e.preventDefault();
            addItemByQuery(searchInput.value);
        });

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addItemByQuery(searchInput.value);
            }
        });

        // 双击标题清空
        document.querySelector('h1').addEventListener('dblclick', function() {
            if (confirm('清空所有卡片？')) {
                watchList = [];
                renderCards();
            }
        });

        // ---------- 启动 ----------
        renderCards();
        console.log('📌 全球看板已启动 (实时行情嵌入)');
        console.log('💡 输入代码 如 00700, AAPL, 600519, 510300');
        console.log('💡 每个卡片显示新浪财经实时行情页');
        console.log('💡 点击 ⟳ 刷新当前行情，点击 ✕ 移除');
    })();
</script>
</body>
</html>
