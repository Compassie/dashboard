<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>📈 全球行情看板 · 实时涨跌幅</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .dashboard {
            max-width: 720px;
            width: 100%;
            background: white;
            border-radius: 36px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0, 0, 0, 0.04);
            padding: 28px 22px 32px;
        }
        h1 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 1.7rem;
            letter-spacing: -0.3px;
            color: #0b1b33;
            margin-bottom: 12px;
        }
        h1 small {
            font-size: 0.95rem;
            font-weight: 400;
            color: #5b6f88;
            margin-left: auto;
            background: #eef2f7;
            padding: 4px 14px;
            border-radius: 40px;
        }
        .subhead {
            color: #3a4c66;
            font-size: 0.95rem;
            margin-bottom: 24px;
            border-left: 4px solid #2469f0;
            padding-left: 14px;
            background: #f0f5ff;
            border-radius: 0 12px 12px 0;
            line-height: 1.4;
        }
        .search-box {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 28px;
        }
        .search-box input {
            flex: 2 1 200px;
            padding: 14px 18px;
            border: 1px solid #d9e0e8;
            border-radius: 60px;
            font-size: 1rem;
            background: #fafcff;
            outline: none;
            transition: 0.2s;
            color: #0a1a2f;
        }
        .search-box input:focus {
            border-color: #2469f0;
            background: white;
            box-shadow: 0 0 0 3px rgba(36, 105, 240, 0.15);
        }
        .search-box input::placeholder {
            color: #8a9bb0;
        }
        .search-box button {
            flex: 0 0 auto;
            padding: 14px 28px;
            background: #2469f0;
            color: white;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 6px 14px rgba(36, 105, 240, 0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .search-box button:hover {
            background: #1a56d0;
            transform: scale(0.97);
        }
        .search-box button:active {
            transform: scale(0.94);
        }
        .search-box button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .card-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 6px;
            min-height: 100px;
        }

        .stock-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 18px 20px;
            border: 1px solid #edf2f9;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            transition: 0.15s;
        }
        .stock-card:hover {
            border-color: #cddae9;
            background: #fbfdff;
        }

        .stock-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 140px;
        }
        .stock-symbol {
            font-weight: 650;
            font-size: 1.2rem;
            color: #0b1b33;
        }
        .stock-name {
            font-size: 0.9rem;
            color: #49607c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }
        .stock-exchange {
            font-size: 0.75rem;
            background: #e8edf6;
            padding: 2px 12px;
            border-radius: 30px;
            color: #2c405c;
            display: inline-block;
            margin-top: 3px;
            align-self: flex-start;
        }

        .stock-price-area {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .stock-price {
            font-weight: 600;
            font-size: 1.3rem;
            color: #0b1b33;
            white-space: nowrap;
        }
        .stock-change {
            font-weight: 600;
            font-size: 1.1rem;
            padding: 6px 16px;
            border-radius: 60px;
            background: #f1f5fa;
            min-width: 82px;
            text-align: center;
            white-space: nowrap;
        }
        .stock-change.positive {
            background: #e6f7ed;
            color: #0d7c4b;
        }
        .stock-change.negative {
            background: #fdeaea;
            color: #bc2c3e;
        }
        .stock-change.neutral {
            background: #f0f2f5;
            color: #4f637e;
        }

        .empty-state {
            text-align: center;
            padding: 32px 10px;
            color: #6f86a3;
            background: #f8faff;
            border-radius: 40px;
            border: 1px dashed #d2ddea;
        }
        .empty-state span {
            font-size: 2.6rem;
            display: block;
            margin-bottom: 8px;
        }
        .empty-state p {
            font-size: 0.95rem;
        }

        .footer-note {
            margin-top: 24px;
            font-size: 0.75rem;
            color: #7b91ad;
            text-align: center;
            border-top: 1px solid #eef3f9;
            padding-top: 18px;
        }

        @media (max-width: 500px) {
            .dashboard { padding: 20px 16px; }
            .stock-card { flex-direction: column; align-items: flex-start; gap: 12px; }
            .stock-price-area { width: 100%; justify-content: space-between; }
            .stock-change { min-width: 70px; }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <h1>
        📊 全球看板
        <small>实时</small>
    </h1>
    <div class="subhead">
        🔍 输入基金/股票代码或名称 · 支持港股 美股 A股
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="例: 00700, AAPL, 贵州茅台, 510300" value="">
        <button id="searchBtn">➕ 添加</button>
    </div>

    <div id="cardContainer" class="card-grid">
        <div class="empty-state" id="emptyPlaceholder">
            <span>📭</span>
            <p>输入代码或名称，点击添加<br>（支持港股、美股、A股）</p>
        </div>
    </div>
    <div class="footer-note">
        ⚡ 数据来自新浪财经 · 双击卡片移除 · 完全无需代理
    </div>
</div>

<script>
    (function() {
        // ---------- 核心状态 ----------
        let watchList = [];
        const container = document.getElementById('cardContainer');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');

        // ---------- 使用 Script 标签加载 (无跨域问题) ----------
        function fetchStockData(symbol) {
            return new Promise((resolve, reject) => {
                const sinaCode = buildSinaCode(symbol);
                if (!sinaCode) {
                    reject(new Error(`无法识别代码: ${symbol}，请使用标准格式 (如 00700, AAPL, 600519)`));
                    return;
                }

                // 新浪返回的是 var hq_str_xxx = "数据"; 直接执行会挂载到 window
                const script = document.createElement('script');
                const url = `https://hq.sinajs.cn/list=${sinaCode}`;
                script.src = url;
                script.async = true;

                // 设置超时
                const timeoutId = setTimeout(() => {
                    if (script.parentNode) script.parentNode.removeChild(script);
                    reject(new Error('请求超时，请稍后重试'));
                }, 10000);

                script.onload = function() {
                    clearTimeout(timeoutId);
                    // 数据已经通过 script 加载，从全局变量中读取
                    const varName = `hq_str_${sinaCode}`;
                    const dataStr = window[varName];
                    if (dataStr) {
                        try {
                            const parsed = parseSinaData(dataStr, sinaCode);
                            if (parsed && parsed.price > 0) {
                                resolve(parsed);
                            } else {
                                reject(new Error('数据解析失败，请检查代码是否正确'));
                            }
                        } catch (e) {
                            reject(new Error('数据格式异常: ' + e.message));
                        }
                    } else {
                        reject(new Error('未获取到数据，请检查代码是否正确'));
                    }
                    // 清理全局变量
                    delete window[varName];
                };

                script.onerror = function() {
                    clearTimeout(timeoutId);
                    if (script.parentNode) script.parentNode.removeChild(script);
                    reject(new Error('网络请求失败，请检查网络连接'));
                };

                document.head.appendChild(script);
            });
        }

        // 构建新浪代码
        function buildSinaCode(symbol) {
            const upper = symbol.toUpperCase().replace('.HK', '');
            // 美股：纯字母（且不是A股指数）
            if (/^[A-Z]+$/.test(upper) && !/^(SH|SZ|HK)/.test(upper)) {
                return `us${upper}`;
            }
            // 港股：0开头5位数字 或 包含.HK
            if (/^0\d{4}/.test(upper) || upper.includes('.HK')) {
                const num = upper.replace(/\D/g, '');
                if (num.length === 5) return `hk${num}`;
                if (num.length === 4) return `hk0${num}`;
                return `hk${num}`;
            }
            // A股：6开头 → 上海，0/3开头 → 深圳
            if (/^6\d{5}/.test(upper)) return `sh${upper}`;
            if (/^[03]\d{5}/.test(upper)) return `sz${upper}`;
            // 基金：5开头 → 上海，1开头 → 深圳
            if (/^5\d{5}/.test(upper)) return `sh${upper}`;
            if (/^1[56]\d{4}/.test(upper)) return `sz${upper}`;
            // 尝试补全
            if (upper.length === 5) {
                if (upper.startsWith('6')) return `sh${upper}`;
                if (upper.startsWith('0') || upper.startsWith('3')) return `sz${upper}`;
            }
            return null;
        }

        // 解析新浪数据
        function parseSinaData(str, sinaCode) {
            const parts = str.split(',');
            if (parts.length < 6) throw new Error('数据字段不足');

            const name = parts[0].trim() || sinaCode;
            let price = 0, closePrice = 0;
            
            // 根据市场解析不同位置
            if (sinaCode.startsWith('hk')) {
                price = parseFloat(parts[1]) || 0;
                closePrice = parseFloat(parts[3]) || price;
            } else if (sinaCode.startsWith('us')) {
                price = parseFloat(parts[1]) || 0;
                closePrice = parseFloat(parts[3]) || price;
            } else {
                price = parseFloat(parts[1]) || 0;
                closePrice = parseFloat(parts[2]) || price;
            }

            let changePercent = 0;
            if (price > 0 && closePrice > 0) {
                changePercent = ((price - closePrice) / closePrice) * 100;
            }

            let exchange = '--';
            if (sinaCode.startsWith('hk')) exchange = 'HKEX';
            else if (sinaCode.startsWith('us')) exchange = 'NASDAQ/NYSE';
            else if (sinaCode.startsWith('sh')) exchange = 'SSE';
            else if (sinaCode.startsWith('sz')) exchange = 'SZSE';

            return {
                symbol: sinaCode.replace(/^(sh|sz|hk|us)/, '').toUpperCase(),
                name: name,
                exchange: exchange,
                price: price,
                changePercent: changePercent
            };
        }

        // ---------- 添加股票 ----------
        async function addItemByQuery(query) {
            if (!query || query.trim() === '') {
                alert('请输入代码或名称');
                return false;
            }
            const q = query.trim();
            
            // 检查是否已存在（忽略大小写）
            const exists = watchList.some(item => item.symbol.toUpperCase() === q.toUpperCase());
            if (exists) {
                alert(`"${q}" 已在看板中`);
                return false;
            }

            searchBtn.disabled = true;
            searchBtn.textContent = '⏳ 查询中...';

            try {
                const data = await fetchStockData(q);
                if (data && data.price > 0) {
                    watchList.push(data);
                    renderCards();
                    searchInput.value = '';
                    searchBtn.disabled = false;
                    searchBtn.textContent = '➕ 添加';
                    return true;
                } else {
                    throw new Error('未获取到有效数据');
                }
            } catch (error) {
                alert(`查询失败: ${error.message || '请检查网络或代码'}`);
                searchBtn.disabled = false;
                searchBtn.textContent = '➕ 添加';
                return false;
            }
        }

        // ---------- 渲染 ----------
        function renderCards() {
            container.innerHTML = '';
            if (watchList.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-state';
                emptyDiv.innerHTML = `
                    <span>📭</span>
                    <p>输入代码或名称，点击添加<br>（支持港股、美股、A股）</p>
                `;
                container.appendChild(emptyDiv);
                return;
            }

            watchList.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'stock-card';

                const infoDiv = document.createElement('div');
                infoDiv.className = 'stock-info';

                const symbolSpan = document.createElement('div');
                symbolSpan.className = 'stock-symbol';
                symbolSpan.textContent = item.symbol;

                const nameSpan = document.createElement('div');
                nameSpan.className = 'stock-name';
                nameSpan.textContent = item.name || '--';

                const exchangeSpan = document.createElement('div');
                exchangeSpan.className = 'stock-exchange';
                exchangeSpan.textContent = item.exchange || '市场';

                infoDiv.appendChild(symbolSpan);
                infoDiv.appendChild(nameSpan);
                infoDiv.appendChild(exchangeSpan);

                const priceArea = document.createElement('div');
                priceArea.className = 'stock-price-area';

                const priceSpan = document.createElement('div');
                priceSpan.className = 'stock-price';
                priceSpan.textContent = item.price ? item.price.toFixed(2) : '--';

                const changeSpan = document.createElement('div');
                changeSpan.className = 'stock-change';
                const changeVal = item.changePercent ?? 0;
                let changeText = '';
                if (changeVal > 0.005) {
                    changeText = `+${changeVal.toFixed(2)}%`;
                    changeSpan.classList.add('positive');
                } else if (changeVal < -0.005) {
                    changeText = `${changeVal.toFixed(2)}%`;
                    changeSpan.classList.add('negative');
                } else {
                    changeText = `0.00%`;
                    changeSpan.classList.add('neutral');
                }
                changeSpan.textContent = changeText;

                priceArea.appendChild(priceSpan);
                priceArea.appendChild(changeSpan);

                card.appendChild(infoDiv);
                card.appendChild(priceArea);

                // 双击删除
                card.addEventListener('dblclick', function(e) {
                    e.stopPropagation();
                    watchList = watchList.filter((w, idx) => idx !== index);
                    renderCards();
                });

                container.appendChild(card);
            });
        }

        // ---------- 事件绑定 ----------
        searchBtn.addEventListener('click', function(e) {
            e.preventDefault();
            addItemByQuery(searchInput.value);
        });

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addItemByQuery(searchInput.value);
            }
        });

        // 双击标题清空
        document.querySelector('h1').addEventListener('dblclick', function() {
            if (confirm('清空所有卡片？')) {
                watchList = [];
                renderCards();
            }
        });

        renderCards();
        console.log('📌 全球看板已启动 (使用Script加载，无跨域问题)');
        console.log('💡 输入代码 如 00700, AAPL, 600519, 510300');
        console.log('💡 双击卡片可移除，双击标题可清空');
    })();
</script>
</body>
< /html>
