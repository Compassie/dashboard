<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>📈 全球行情看板 · 实时涨跌幅</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .dashboard {
            max-width: 720px;
            width: 100%;
            background: white;
            border-radius: 36px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0, 0, 0, 0.04);
            padding: 28px 22px 32px;
        }
        h1 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 1.7rem;
            letter-spacing: -0.3px;
            color: #0b1b33;
            margin-bottom: 8px;
        }
        h1 small {
            font-size: 0.85rem;
            font-weight: 400;
            color: #5b6f88;
            margin-left: auto;
            background: #eef2f7;
            padding: 4px 14px;
            border-radius: 40px;
        }
        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            color: #5b6f88;
            margin-bottom: 16px;
            padding: 6px 14px;
            background: #f0f4fa;
            border-radius: 30px;
            flex-wrap: wrap;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.online { background: #0d7c4b; }
        .status-dot.offline { background: #bc2c3e; }
        .status-dot.demo { background: #f5a623; }
        .subhead {
            color: #3a4c66;
            font-size: 0.95rem;
            margin-bottom: 24px;
            border-left: 4px solid #2469f0;
            padding-left: 14px;
            background: #f0f5ff;
            border-radius: 0 12px 12px 0;
            line-height: 1.4;
        }
        .search-box {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 28px;
        }
        .search-box input {
            flex: 2 1 200px;
            padding: 14px 18px;
            border: 1px solid #d9e0e8;
            border-radius: 60px;
            font-size: 1rem;
            background: #fafcff;
            outline: none;
            transition: 0.2s;
            color: #0a1a2f;
        }
        .search-box input:focus {
            border-color: #2469f0;
            background: white;
            box-shadow: 0 0 0 3px rgba(36, 105, 240, 0.15);
        }
        .search-box input::placeholder {
            color: #8a9bb0;
        }
        .search-box button {
            flex: 0 0 auto;
            padding: 14px 28px;
            background: #2469f0;
            color: white;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 6px 14px rgba(36, 105, 240, 0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .search-box button:hover {
            background: #1a56d0;
            transform: scale(0.97);
        }
        .search-box button:active {
            transform: scale(0.94);
        }
        .search-box button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .card-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 6px;
            min-height: 100px;
        }

        .stock-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 18px 20px;
            border: 1px solid #edf2f9;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            transition: 0.15s;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .stock-card:hover {
            border-color: #cddae9;
            background: #fbfdff;
        }
        .stock-card.demo-mode {
            border-left: 4px solid #f5a623;
        }

        .stock-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 140px;
        }
        .stock-symbol {
            font-weight: 650;
            font-size: 1.2rem;
            color: #0b1b33;
        }
        .stock-name {
            font-size: 0.9rem;
            color: #49607c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }
        .stock-exchange {
            font-size: 0.75rem;
            background: #e8edf6;
            padding: 2px 12px;
            border-radius: 30px;
            color: #2c405c;
            display: inline-block;
            margin-top: 3px;
            align-self: flex-start;
        }
        .stock-tag {
            font-size: 0.65rem;
            background: #f5a623;
            color: white;
            padding: 1px 10px;
            border-radius: 20px;
            margin-left: 8px;
        }

        .stock-price-area {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .stock-price {
            font-weight: 600;
            font-size: 1.3rem;
            color: #0b1b33;
            white-space: nowrap;
        }
        .stock-change {
            font-weight: 600;
            font-size: 1.1rem;
            padding: 6px 16px;
            border-radius: 60px;
            background: #f1f5fa;
            min-width: 82px;
            text-align: center;
            white-space: nowrap;
        }
        .stock-change.positive {
            background: #e6f7ed;
            color: #0d7c4b;
        }
        .stock-change.negative {
            background: #fdeaea;
            color: #bc2c3e;
        }
        .stock-change.neutral {
            background: #f0f2f5;
            color: #4f637e;
        }

        .empty-state {
            text-align: center;
            padding: 32px 10px;
            color: #6f86a3;
            background: #f8faff;
            border-radius: 40px;
            border: 1px dashed #d2ddea;
        }
        .empty-state span {
            font-size: 2.6rem;
            display: block;
            margin-bottom: 8px;
        }
        .empty-state p {
            font-size: 0.95rem;
        }

        .footer-note {
            margin-top: 24px;
            font-size: 0.75rem;
            color: #7b91ad;
            text-align: center;
            border-top: 1px solid #eef3f9;
            padding-top: 18px;
        }

        .demo-badge {
            display: inline-block;
            background: #f5a623;
            color: white;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        @media (max-width: 500px) {
            .dashboard { padding: 20px 16px; }
            .stock-card { flex-direction: column; align-items: flex-start; gap: 12px; }
            .stock-price-area { width: 100%; justify-content: space-between; }
            .stock-change { min-width: 70px; }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <h1>
        📊 全球看板
        <small id="modeLabel">🌐 实时</small>
    </h1>
    <div class="status-bar" id="statusBar">
        <span class="status-dot online" id="statusDot"></span>
        <span id="statusText">数据源连接中...</span>
    </div>
    <div class="subhead">
        🔍 输入基金/股票代码或名称 · 支持港股 美股 A股
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="例: 00700, AAPL, 贵州茅台, 510300" value="">
        <button id="searchBtn">➕ 添加</button>
    </div>

    <div id="cardContainer" class="card-grid">
        <div class="empty-state" id="emptyPlaceholder">
            <span>📭</span>
            <p>输入代码或名称，点击添加<br>（支持港股、美股、A股）</p>
        </div>
    </div>
    <div class="footer-note">
        ⚡ 双击卡片移除 · 自动切换数据源 · 网络不通时使用模拟数据
    </div>
</div>

<script>
    (function() {
        // ---------- 核心状态 ----------
        let watchList = [];
        let isOnline = false;
        let isDemoMode = false;
        const container = document.getElementById('cardContainer');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const modeLabel = document.getElementById('modeLabel');

        // ---------- 数据源1: 东方财富 API (更稳定) ----------
        function fetchEastMoney(symbol) {
            return new Promise((resolve, reject) => {
                const code = buildEastMoneyCode(symbol);
                if (!code) {
                    reject(new Error(`无法识别代码: ${symbol}`));
                    return;
                }

                const url = `https://push2.eastmoney.com/api/qt/stock/get?secid=${code}&fields=f43,f44,f45,f46,f47,f48,f49,f50,f51,f52,f57,f58,f60,f116,f117,f124,f125`;
                
                const script = document.createElement('script');
                script.src = url + '&cb=handleEastMoney';
                script.async = true;

                const timeoutId = setTimeout(() => {
                    if (script.parentNode) script.parentNode.removeChild(script);
                    reject(new Error('请求超时'));
                }, 8000);

                // 定义全局回调
                window.handleEastMoney = function(data) {
                    clearTimeout(timeoutId);
                    if (script.parentNode) script.parentNode.removeChild(script);
                    
                    if (data && data.data) {
                        const d = data.data;
                        const price = d.f43 || 0;      // 最新价
                        const close = d.f44 || d.f45 || 0; // 昨收
                        const name = d.f58 || symbol;
                        const changePercent = (price > 0 && close > 0) ? ((price - close) / close * 100) : 0;
                        
                        // 判断市场
                        let exchange = '--';
                        if (code.includes('HK')) exchange = 'HKEX';
                        else if (code.includes('US')) exchange = 'NASDAQ/NYSE';
                        else if (code.startsWith('0.') || code.startsWith('1.')) exchange = 'SSE';
                        else if (code.startsWith('2.')) exchange = 'SZSE';
                        
                        resolve({
                            symbol: symbol.toUpperCase(),
                            name: name,
                            exchange: exchange,
                            price: price,
                            changePercent: changePercent
                        });
                    } else {
                        reject(new Error('数据为空'));
                    }
                    delete window.handleEastMoney;
                };

                document.head.appendChild(script);
            });
        }

        function buildEastMoneyCode(symbol) {
            const s = symbol.toUpperCase().trim();
            // 港股: 00700 -> HK.00700
            if (/^0\d{4}/.test(s) || /^\d{5}/.test(s)) {
                return `HK.${s}`;
            }
            // 美股: AAPL -> US.AAPL
            if (/^[A-Z]+$/.test(s) && s.length <= 5) {
                return `US.${s}`;
            }
            // A股: 6开头 -> 1.600519 (上海), 0/3开头 -> 0.000001 (深圳)
            if (/^6\d{5}/.test(s)) return `1.${s}`;
            if (/^[03]\d{5}/.test(s)) return `0.${s}`;
            return null;
        }

        // ---------- 数据源2: 新浪财经 (备选) ----------
        function fetchSina(symbol) {
            return new Promise((resolve, reject) => {
                const sinaCode = buildSinaCode(symbol);
                if (!sinaCode) {
                    reject(new Error('无法构建新浪代码'));
                    return;
                }

                const script = document.createElement('script');
                const url = `https://hq.sinajs.cn/list=${sinaCode}`;
                script.src = url;
                script.async = true;

                const timeoutId = setTimeout(() => {
                    if (script.parentNode) script.parentNode.removeChild(script);
                    reject(new Error('新浪请求超时'));
                }, 8000);

                script.onload = function() {
                    clearTimeout(timeoutId);
                    const varName = `hq_str_${sinaCode}`;
                    const dataStr = window[varName];
                    if (dataStr) {
                        try {
                            const parsed = parseSinaData(dataStr, sinaCode);
                            if (parsed && parsed.price > 0) {
                                resolve(parsed);
                            } else {
                                reject(new Error('新浪数据无效'));
                            }
                        } catch (e) {
                            reject(new Error('新浪数据解析失败'));
                        }
                    } else {
                        reject(new Error('新浪数据未找到'));
                    }
                    delete window[varName];
                };

                script.onerror = function() {
                    clearTimeout(timeoutId);
                    reject(new Error('新浪网络请求失败'));
                };

                document.head.appendChild(script);
            });
        }

        function buildSinaCode(symbol) {
            const upper = symbol.toUpperCase().replace('.HK', '');
            if (/^[A-Z]+$/.test(upper) && !/^(SH|SZ|HK)/.test(upper)) {
                return `us${upper}`;
            }
            if (/^0\d{4}/.test(upper) || upper.includes('.HK')) {
                const num = upper.replace(/\D/g, '');
                if (num.length === 5) return `hk${num}`;
                if (num.length === 4) return `hk0${num}`;
                return `hk${num}`;
            }
            if (/^6\d{5}/.test(upper)) return `sh${upper}`;
            if (/^[03]\d{5}/.test(upper)) return `sz${upper}`;
            if (/^5\d{5}/.test(upper)) return `sh${upper}`;
            if (/^1[56]\d{4}/.test(upper)) return `sz${upper}`;
            if (upper.length === 5) {
                if (upper.startsWith('6')) return `sh${upper}`;
                if (upper.startsWith('0') || upper.startsWith('3')) return `sz${upper}`;
            }
            return null;
        }

        function parseSinaData(str, sinaCode) {
            const parts = str.split(',');
            if (parts.length < 6) throw new Error('数据字段不足');
            const name = parts[0].trim() || sinaCode;
            let price = 0, closePrice = 0;
            if (sinaCode.startsWith('hk')) {
                price = parseFloat(parts[1]) || 0;
                closePrice = parseFloat(parts[3]) || price;
            } else if (sinaCode.startsWith('us')) {
                price = parseFloat(parts[1]) || 0;
                closePrice = parseFloat(parts[3]) || price;
            } else {
                price = parseFloat(parts[1]) || 0;
                closePrice = parseFloat(parts[2]) || price;
            }
            let changePercent = 0;
            if (price > 0 && closePrice > 0) {
                changePercent = ((price - closePrice) / closePrice) * 100;
            }
            let exchange = '--';
            if (sinaCode.startsWith('hk')) exchange = 'HKEX';
            else if (sinaCode.startsWith('us')) exchange = 'NASDAQ/NYSE';
            else if (sinaCode.startsWith('sh')) exchange = 'SSE';
            else if (sinaCode.startsWith('sz')) exchange = 'SZSE';
            return {
                symbol: sinaCode.replace(/^(sh|sz|hk|us)/, '').toUpperCase(),
                name: name,
                exchange: exchange,
                price: price,
                changePercent: changePercent
            };
        }

        // ---------- 模拟数据 (离线演示) ----------
        function getMockData(symbol) {
            const s = symbol.toUpperCase().trim();
            const mockDB = {
                '00700': { name: '腾讯控股', exchange: 'HKEX', price: 345.2, changePercent: 1.23 },
                '09988': { name: '阿里巴巴-SW', exchange: 'HKEX', price: 78.5, changePercent: -0.67 },
                'AAPL': { name: '苹果', exchange: 'NASDAQ', price: 187.5, changePercent: -0.23 },
                'TSLA': { name: '特斯拉', exchange: 'NASDAQ', price: 245.6, changePercent: 2.89 },
                '600519': { name: '贵州茅台', exchange: 'SSE', price: 1689.0, changePercent: 0.56 },
                '000858': { name: '五粮液', exchange: 'SZSE', price: 148.3, changePercent: -1.34 },
                '510300': { name: '沪深300ETF', exchange: 'SSE', price: 3.892, changePercent: 0.33 },
            };
            // 尝试匹配
            for (let key in mockDB) {
                if (s === key || s.includes(key) || key.includes(s)) {
                    return { symbol: key, ...mockDB[key] };
                }
            }
            // 随机生成
            const change = (Math.random() * 6 - 3);
            return {
                symbol: s,
                name: `${s} (模拟)`,
                exchange: '--',
                price: 10 + Math.random() * 200,
                changePercent: change
            };
        }

        // ---------- 统一获取数据 (多数据源容灾) ----------
        async function fetchStockData(symbol) {
            // 先尝试东方财富
            try {
                const result = await fetchEastMoney(symbol);
                if (result && result.price > 0) {
                    isOnline = true;
                    isDemoMode = false;
                    updateStatus(true);
                    return result;
                }
            } catch (e) {
                console.log('东方财富失败，尝试新浪...');
            }

            // 再尝试新浪
            try {
                const result = await fetchSina(symbol);
                if (result && result.price > 0) {
                    isOnline = true;
                    isDemoMode = false;
                    updateStatus(true);
                    return result;
                }
            } catch (e) {
                console.log('新浪失败，使用模拟数据...');
            }

            // 全部失败，使用模拟数据
            isOnline = false;
            isDemoMode = true;
            updateStatus(false);
            const mock = getMockData(symbol);
            // 增加模拟标记
            mock.isMock = true;
            return mock;
        }

        // ---------- 状态更新 ----------
        function updateStatus(online) {
            if (online) {
                statusDot.className = 'status-dot online';
                statusText.textContent = '🟢 数据在线 (东方财富/新浪)';
                modeLabel.textContent = '🌐 实时';
            } else {
                statusDot.className = 'status-dot demo';
                statusText.textContent = '🟡 演示模式 (使用模拟数据)';
                modeLabel.textContent = '🎯 演示';
            }
        }

        // ---------- 添加股票 ----------
        async function addItemByQuery(query) {
            if (!query || query.trim() === '') {
                alert('请输入代码或名称');
                return false;
            }
            const q = query.trim();
            
            const exists = watchList.some(item => item.symbol.toUpperCase() === q.toUpperCase());
            if (exists) {
                alert(`"${q}" 已在看板中`);
                return false;
            }

            searchBtn.disabled = true;
            searchBtn.textContent = '⏳ 查询中...';

            try {
                const data = await fetchStockData(q);
                if (data && data.price > 0) {
                    watchList.push(data);
                    renderCards();
                    searchInput.value = '';
                    searchBtn.disabled = false;
                    searchBtn.textContent = '➕ 添加';
                    return true;
                } else {
                    throw new Error('未获取到有效数据');
                }
            } catch (error) {
                alert(`查询失败: ${error.message || '请检查网络或代码'}`);
                searchBtn.disabled = false;
                searchBtn.textContent = '➕ 添加';
                return false;
            }
        }

        // ---------- 渲染 ----------
        function renderCards() {
            container.innerHTML = '';
            if (watchList.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-state';
                emptyDiv.innerHTML = `
                    <span>📭</span>
                    <p>输入代码或名称，点击添加<br>（支持港股、美股、A股）</p>
                `;
                container.appendChild(emptyDiv);
                return;
            }

            watchList.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'stock-card';
                if (item.isMock) {
                    card.classList.add('demo-mode');
                }

                const infoDiv = document.createElement('div');
                infoDiv.className = 'stock-info';

                const symbolSpan = document.createElement('div');
                symbolSpan.className = 'stock-symbol';
                symbolSpan.textContent = item.symbol;
                if (item.isMock) {
                    const tag = document.createElement('span');
                    tag.className = 'stock-tag';
                    tag.textContent = '模拟';
                    symbolSpan.appendChild(tag);
                }

                const nameSpan = document.createElement('div');
                nameSpan.className = 'stock-name';
                nameSpan.textContent = item.name || '--';

                const exchangeSpan = document.createElement('div');
                exchangeSpan.className = 'stock-exchange';
                exchangeSpan.textContent = item.exchange || '市场';

                infoDiv.appendChild(symbolSpan);
                infoDiv.appendChild(nameSpan);
                infoDiv.appendChild(exchangeSpan);

                const priceArea = document.createElement('div');
                priceArea.className = 'stock-price-area';

                const priceSpan = document.createElement('div');
                priceSpan.className = 'stock-price';
                priceSpan.textContent = item.price ? item.price.toFixed(2) : '--';

                const changeSpan = document.createElement('div');
                changeSpan.className = 'stock-change';
                const changeVal = item.changePercent ?? 0;
                let changeText = '';
                if (changeVal > 0.005) {
                    changeText = `+${changeVal.toFixed(2)}%`;
                    changeSpan.classList.add('positive');
                } else if (changeVal < -0.005) {
                    changeText = `${changeVal.toFixed(2)}%`;
                    changeSpan.classList.add('negative');
                } else {
                    changeText = `0.00%`;
                    changeSpan.classList.add('neutral');
                }
                changeSpan.textContent = changeText;

                priceArea.appendChild(priceSpan);
                priceArea.appendChild(changeSpan);

                card.appendChild(infoDiv);
                card.appendChild(priceArea);

                card.addEventListener('dblclick', function(e) {
                    e.stopPropagation();
                    watchList = watchList.filter((w, idx) => idx !== index);
                    renderCards();
                });

                container.appendChild(card);
            });
        }

        // ---------- 初始化状态检测 ----------
        async function checkConnectivity() {
            try {
                const test = await fetchEastMoney('AAPL');
                if (test && test.price > 0) {
                    isOnline = true;
                    isDemoMode = false;
                    updateStatus(true);
                    return;
                }
            } catch (e) {}
            try {
                const test = await fetchSina('AAPL');
                if (test && test.price > 0) {
                    isOnline = true;
                    isDemoMode = false;
                    updateStatus(true);
                    return;
                }
            } catch (e) {}
            // 全部失败
            isOnline = false;
            isDemoMode = true;
            updateStatus(false);
        }

        // ---------- 事件绑定 ----------
        searchBtn.addEventListener('click', function(e) {
            e.preventDefault();
            addItemByQuery(searchInput.value);
        });

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addItemByQuery(searchInput.value);
            }
        });

        document.querySelector('h1').addEventListener('dblclick', function() {
            if (confirm('清空所有卡片？')) {
                watchList = [];
                renderCards();
            }
        });

        // 启动
        renderCards();
        checkConnectivity();
        console.log('📌 全球看板已启动 (东方财富 + 新浪 + 模拟容灾)');
